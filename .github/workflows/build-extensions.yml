name: Build Extensions DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout pinned source with native CA and previous crash fixes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firstoni-dev/ascension-extensions-reconstruction
          ref: 5197e753e564a4955f82c79a055e4f53f490fac3
          persist-credentials: false

      - name: Configure 32-bit Windows build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Compile DLL
        run: cmake --build build --config RelWithDebInfo --parallel 2

      - name: Package DLL and debug symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/RelWithDebInfo/Extensions.dll package/
          Copy-Item build/RelWithDebInfo/Extensions.pdb package/
          git rev-parse HEAD | Set-Content package/SOURCE.txt
          $hash = (Get-FileHash package/Extensions.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Extensions.dll" | Set-Content -Encoding ascii package/SHA256SUMS

      - name: Upload download package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Extensions-win32-5197e75
          path: package/
          if-no-files-found: error
          retention-days: 30
